<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#5b45e0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Catálogo">
    <title>Mi Catálogo</title>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    <header class="header">
        <h1 class="header__title">🛒 Mi Catálogo</h1>
        <button id="admin-toggle-btn" class="header__admin-btn" type="button" aria-label="Modo administrador">🔒</button>
    </header>

    <div class="searchbar">
        <input
            id="search-input"
            type="search"
            inputmode="search"
            placeholder="Buscar producto..."
            autocomplete="off"
        >
        <button id="scan-btn" class="searchbar__scan-btn" type="button" aria-label="Escanear código de barras">📷</button>
    </div>

    <button id="categories-drawer-btn" class="category-selector" type="button" aria-haspopup="true">
        <span class="category-selector__icon">🏷️</span>
        <span id="category-selector-label" class="category-selector__label">Todas las categorías</span>
        <span class="category-selector__arrow">▾</span>
    </button>

    <div id="admin-bar" class="admin-bar" hidden>
        <span class="admin-bar__label">🔓 Modo administrador</span>
        <button id="categories-btn" class="admin-bar__btn" type="button">🏷️ Categorías</button>
        <button id="backup-btn" class="admin-bar__btn" type="button">💾 Respaldo</button>
        <button id="logout-btn" class="admin-bar__btn" type="button">Salir</button>
    </div>

    <nav id="admin-filters" class="chips chips--admin" aria-label="Filtros de mantenimiento" hidden>
        <button id="filter-no-photo" class="chip chip--tool" type="button" data-filter="no-photo">📷 Sin foto</button>
        <button id="filter-no-price" class="chip chip--tool" type="button" data-filter="no-price">💲 Sin precio</button>
        <button id="filter-duplicates" class="chip chip--tool" type="button" data-filter="duplicates">⚠️ Duplicados</button>
    </nav>

    <main id="product-grid" class="grid"></main>

    <p id="empty-state" class="empty-state" hidden>No se encontraron productos.</p>
    <p id="loading-state" class="loading-state">Cargando productos…</p>

    <button id="add-fab" class="fab" type="button" aria-label="Agregar producto" hidden>+</button>

    <!-- PIN modal -->
    <div id="pin-modal" class="modal" hidden>
        <div class="modal__backdrop" data-close="pin"></div>
        <div class="modal__sheet modal__sheet--small">
            <h2 class="modal__title">Acceso de administrador</h2>
            <form id="pin-form">
                <input id="pin-input" class="modal__pin-input" type="password" inputmode="numeric"
                       pattern="[0-9]*" autocomplete="off" placeholder="PIN" maxlength="12">
                <p id="pin-error" class="modal__error" hidden>PIN incorrecto</p>
                <div class="modal__actions">
                    <button type="button" class="btn btn--ghost" data-close="pin">Cancelar</button>
                    <button type="submit" class="btn btn--primary">Entrar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Product form modal -->
    <div id="product-modal" class="modal" hidden>
        <div class="modal__backdrop" data-close="product"></div>
        <div class="modal__sheet">
            <h2 id="product-modal-title" class="modal__title">Agregar producto</h2>
            <form id="product-form">
                <input type="hidden" id="product-id">

                <label class="field">
                    <span class="field__label">Nombre *</span>
                    <input id="field-name" type="text" required>
                </label>

                <label class="field">
                    <span class="field__label">Precio *</span>
                    <input id="field-price" type="number" step="0.01" min="0" required>
                </label>

                <div class="field-row">
                    <label class="field">
                        <span class="field__label">Cantidad</span>
                        <input id="field-qty" type="text" placeholder="500">
                    </label>
                    <label class="field">
                        <span class="field__label">Unidad</span>
                        <input id="field-unit" type="text" placeholder="g, ml, pza...">
                    </label>
                </div>

                <label class="field">
                    <span class="field__label">Código de barras</span>
                    <div class="field-with-btn">
                        <input id="field-barcode" type="text" inputmode="numeric" placeholder="Opcional">
                        <button id="scan-barcode-field-btn" type="button" class="btn btn--ghost">📷</button>
                    </div>
                </label>

                <label class="field">
                    <span class="field__label">Descripción</span>
                    <textarea id="field-description" rows="2"></textarea>
                </label>

                <label class="field">
                    <span class="field__label">Foto</span>
                    <div id="current-photo-wrap" class="current-photo" hidden>
                        <img id="current-photo-img" class="current-photo__img" alt="Foto actual">
                        <button id="rotate-photo-btn" type="button" class="btn btn--ghost">🔄 Rotar</button>
                    </div>
                    <input id="field-image" type="file" accept="image/*" capture="environment">
                </label>

                <fieldset class="field">
                    <legend class="field__label">Categorías</legend>
                    <div id="category-checkboxes" class="category-checkboxes"></div>
                </fieldset>

                <label class="field field--switch">
                    <span class="field__label">Visible para clientes</span>
                    <input id="field-visible" type="checkbox" checked>
                </label>

                <div class="modal__actions modal__actions--space-between">
                    <button id="delete-btn" type="button" class="btn btn--danger" hidden>Eliminar</button>
                    <div class="modal__actions">
                        <button type="button" class="btn btn--ghost" data-close="product">Cancelar</button>
                        <button type="submit" class="btn btn--primary">Guardar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Category management modal -->
    <div id="categories-modal" class="modal" hidden>
        <div class="modal__backdrop" data-close="categories"></div>
        <div class="modal__sheet">
            <h2 class="modal__title">Categorías</h2>

            <form id="category-add-form" class="field-row">
                <label class="field" style="flex: 1 1 auto;">
                    <span class="field__label">Nueva categoría</span>
                    <input id="new-category-name" type="text" placeholder="Nombre de la categoría" required>
                </label>
                <button type="submit" class="btn btn--primary" style="align-self: flex-end; margin-bottom: 14px;">Agregar</button>
            </form>

            <ul id="category-list" class="category-list"></ul>

            <div class="modal__actions">
                <button type="button" class="btn btn--ghost" data-close="categories">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Category drawer -->
    <div id="category-drawer-modal" class="modal modal--drawer" hidden>
        <div class="modal__backdrop" data-close="category-drawer"></div>
        <nav class="modal__sheet modal__sheet--drawer" aria-label="Todas las categorías">
            <h2 class="modal__title">Categorías</h2>
            <ul id="category-drawer-list" class="drawer-list"></ul>
        </nav>
    </div>

    <!-- Quick view modal (tap en tile) -->
    <div id="quickview-modal" class="modal" hidden>
        <div class="modal__backdrop" data-close="quickview"></div>
        <div class="modal__sheet modal__sheet--quickview">
            <button class="quickview__close" type="button" data-close="quickview" aria-label="Cerrar">✕</button>
            <div class="quickview__img-wrap">
                <img id="quickview-img" class="quickview__img" alt="">
            </div>
            <div class="quickview__body">
                <h2 id="quickview-name" class="quickview__name"></h2>
                <p id="quickview-meta" class="quickview__meta" hidden></p>
                <p id="quickview-price" class="quickview__price"></p>
                <p id="quickview-description" class="quickview__description" hidden></p>
            </div>
            <div id="quickview-admin-actions" class="quickview__admin-actions" hidden>
                <button id="quickview-rotate-btn" type="button" class="btn btn--ghost">🔄 Rotar imagen</button>
                <button id="quickview-edit-btn" type="button" class="btn btn--primary">✏️ Editar</button>
            </div>
        </div>
    </div>

    <!-- Barcode scanner modal -->
    <div id="scan-modal" class="modal" hidden>
        <div class="scan-modal__content">
            <video id="scan-video" class="scan-modal__video" playsinline muted autoplay></video>
            <div class="scan-modal__guide"></div>
            <p id="scan-status" class="scan-modal__status">Apunta al código de barras…</p>
            <button id="scan-cancel-btn" type="button" class="btn btn--ghost scan-modal__cancel">Cancelar</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
