<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#5b45e0">
    <title>Mi Catálogo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    <header class="header">
        <h1 class="header__title">🛒 Mi Catálogo</h1>
    </header>

    <div class="searchbar">
        <input
            id="search-input"
            type="search"
            inputmode="search"
            placeholder="Buscar producto..."
            autocomplete="off"
        >
    </div>

    <nav id="category-chips" class="chips" aria-label="Categorías"></nav>

    <main id="product-grid" class="grid"></main>

    <p id="empty-state" class="empty-state" hidden>No se encontraron productos.</p>
    <p id="loading-state" class="loading-state">Cargando productos…</p>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
